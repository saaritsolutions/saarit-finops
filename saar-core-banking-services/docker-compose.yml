# SaaR Core Banking Services — Docker Compose
# Domain: demobank.saaritsolutions.com (Hetzner VPS)
#
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. Get SSL certs (see nginx/README-SSL.md)
#   3. docker-compose up -d --build

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saar_demo_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - saar-net

  # ── ExpressionBuilderService (port 5004) ─────────────────────────────────────
  expressionbuilder:
    build:
      context: .
      dockerfile: ExpressionBuilderService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5004
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=saar_banking_expressions;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
      ConnectionStrings__ExpressionBuilderDatabase: "Host=postgres;Database=saar_banking_expressions;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://demobank.saaritsolutions.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saar-net

  # ── LoanService (port 5130) ───────────────────────────────────────────────────
  loanservice:
    build:
      context: .
      dockerfile: LoanService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5130
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=LoanServiceDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
      Services__ExpressionBaseUrl: http://expressionbuilder:5004
      Services__WorkflowBaseUrl: http://workfloworchestration:5012
      Services__DynamicFormsBaseUrl: http://dynamicfields:5013
      Services__TransactionBaseUrl: http://transactionservice:5290
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://demobank.saaritsolutions.com}
    depends_on:
      postgres:
        condition: service_healthy
      expressionbuilder:
        condition: service_started
      transactionservice:
        condition: service_started
    networks:
      - saar-net

  # ── WorkflowOrchestrationService (port 5012) ─────────────────────────────────
  workfloworchestration:
    build:
      context: .
      dockerfile: WorkflowOrchestrationService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5012
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=WorkflowDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
      Services__ExpressionBaseUrl: http://expressionbuilder:5004
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://demobank.saaritsolutions.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saar-net

  # ── DynamicFieldsSchemaService (port 5013) ───────────────────────────────────
  dynamicfields:
    build:
      context: .
      dockerfile: DynamicFieldsSchemaService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5013
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://demobank.saaritsolutions.com}
    networks:
      - saar-net

  # ── CustomerService (port 5200) ───────────────────────────────────────────────
  customerservice:
    build:
      context: .
      dockerfile: CustomerService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5200
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=CustomerServiceDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saar-net

  # ── TransactionService (port 5290) ───────────────────────────────────────────
  transactionservice:
    build:
      context: .
      dockerfile: TransactionService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5290
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=TransactionServiceDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://demobank.saaritsolutions.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saar-net

  # ── UserAccessManagementService (port 5033) ──────────────────────────────────
  useraccessmanagement:
    build:
      context: .
      dockerfile: UserAccessManagementService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5033
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=UserAccessDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
      Jwt__Secret: ${JWT_SECRET:-SaarCoreBankingJwtSecret2026DemoKeyLongEnoughForHS256}
      Jwt__Issuer: saar-banking
      Jwt__Audience: saar-banking-clients
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://demobank.saaritsolutions.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saar-net

  # ── AccountService (port 5210) ────────────────────────────────────────────────
  accountservice:
    build:
      context: .
      dockerfile: AccountService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5210
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=AccountServiceDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-saar_demo_2026};Port=5432"
      Services__ExpressionBaseUrl: http://expressionbuilder:5004
      Services__TransactionBaseUrl: http://transactionservice:5290
      Services__WorkflowBaseUrl: http://workfloworchestration:5012
      Services__DynamicFormsBaseUrl: http://dynamicfields:5013
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://demobank.saaritsolutions.com}
    depends_on:
      postgres:
        condition: service_healthy
      expressionbuilder:
        condition: service_started
      transactionservice:
        condition: service_started
      workfloworchestration:
        condition: service_started
    networks:
      - saar-net

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: https://demobank.saaritsolutions.com
        REACT_APP_LOAN_SERVICE_BASE_URL: https://demobank.saaritsolutions.com
        REACT_APP_EXPRESSION_API_URL: https://demobank.saaritsolutions.com
    restart: unless-stopped
    networks:
      saar-net:
        aliases:
          - banking-frontend  # unique alias; avoids DNS clash with AI Consultant's "frontend" service

  # ── Nginx Reverse Proxy (80 + 443) ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - expressionbuilder
      - loanservice
      - workfloworchestration
      - dynamicfields
      - customerservice
      - transactionservice
      - useraccessmanagement
      - accountservice
    networks:
      - saar-net
      - ai-consultant_default  # needed to proxy aiconsultant_frontend:80

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pgdata:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  saar-net:
    driver: bridge
  ai-consultant_default:
    external: true  # pre-existing network from the AI Consultant docker-compose
