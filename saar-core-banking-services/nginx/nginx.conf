worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # Use Docker's embedded DNS so proxy_pass hostnames resolve dynamically
    # (prevents "host not found in upstream" at startup when containers are not
    #  yet started or get a new IP after restart)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Common proxy headers ────────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    # ── HTTP server — redirect to HTTPS + certbot challenges ───────────────────
    server {
        listen 80;
        server_name demobank.saaritsolutions.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ── HTTPS server ────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name demobank.saaritsolutions.com;

        ssl_certificate     /etc/letsencrypt/live/demobank.saaritsolutions.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demobank.saaritsolutions.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── ExpressionBuilderService ───────────────────────────────────────────
        location /api/Expressions {
            set $expr http://expressionbuilder:5004;
            proxy_pass $expr;
        }
        location /api/AIExpression {
            set $expr http://expressionbuilder:5004;
            proxy_pass $expr;
        }
        location /api/AIForm {
            set $expr http://expressionbuilder:5004;
            proxy_pass $expr;
        }
        location /api/ExpressionTemplates {
            set $expr http://expressionbuilder:5004;
            proxy_pass $expr;
        }
        location /api/BankingFunctions {
            set $expr http://expressionbuilder:5004;
            proxy_pass $expr;
        }

        # ── LoanService ────────────────────────────────────────────────────────
        location /api/LoanOrigination {
            set $loan http://loanservice:5130;
            proxy_pass $loan;
        }
        location /api/LoanEligibility {
            set $loan http://loanservice:5130;
            proxy_pass $loan;
        }
        location /api/admin {
            set $loan http://loanservice:5130;
            proxy_pass $loan;
        }

        # ── WorkflowOrchestrationService ───────────────────────────────────────
        location /api/Workflow {
            set $wf http://workfloworchestration:5012;
            proxy_pass $wf;
        }
        location /api/WorkflowRule {
            set $wf http://workfloworchestration:5012;
            proxy_pass $wf;
        }

        # ── DynamicFieldsSchemaService ─────────────────────────────────────────
        location /api/DynamicForm {
            set $df http://dynamicfields:5013;
            proxy_pass $df;
        }

        # ── CustomerService ────────────────────────────────────────────────────
        location /api/customer {
            set $cust http://customerservice:5200;
            proxy_pass $cust;
        }

        # ── TransactionService ─────────────────────────────────────────────────
        location /api/journal {
            set $txn http://transactionservice:5290;
            proxy_pass $txn;
        }
        location /api/ledger {
            set $txn http://transactionservice:5290;
            proxy_pass $txn;
        }

        # ── React Frontend (catch-all) ─────────────────────────────────────────
        location / {
            set $fe http://frontend:80;
            proxy_pass $fe;
        }
    }
}
