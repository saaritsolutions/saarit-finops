worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ── Upstream backend services (Docker DNS names) ───────────────────────────
    upstream expressionbuilder    { server expressionbuilder:5004; }
    upstream loanservice          { server loanservice:5130; }
    upstream workfloworchestration { server workfloworchestration:5012; }
    upstream dynamicfields        { server dynamicfields:5013; }
    upstream customerservice      { server customerservice:5200; }
    upstream transactionservice   { server transactionservice:5290; }
    upstream frontend             { server frontend:80; }

    # ── Common proxy headers (used in all location blocks) ────────────────────
    # Inline instead of proxy_params for Alpine nginx compatibility
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    # ── HTTP server — redirect to HTTPS + serve certbot challenges ────────────
    server {
        listen 80;
        server_name demobank.saaritsolutions.com;

        # Certbot webroot challenge (run before enabling HTTPS)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name demobank.saaritsolutions.com;

        # SSL certificates from Let's Encrypt (obtained via certbot on host)
        ssl_certificate     /etc/letsencrypt/live/demobank.saaritsolutions.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demobank.saaritsolutions.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── ExpressionBuilderService API routes ───────────────────────────────
        location /api/Expressions {
            proxy_pass http://expressionbuilder;
        }
        location /api/AIExpression {
            proxy_pass http://expressionbuilder;
        }
        location /api/AIForm {
            proxy_pass http://expressionbuilder;
        }
        location /api/ExpressionTemplates {
            proxy_pass http://expressionbuilder;
        }
        location /api/BankingFunctions {
            proxy_pass http://expressionbuilder;
        }

        # ── LoanService API routes ────────────────────────────────────────────
        location /api/LoanOrigination {
            proxy_pass http://loanservice;
        }
        location /api/LoanEligibility {
            proxy_pass http://loanservice;
        }
        location /api/admin {
            proxy_pass http://loanservice;
        }

        # ── WorkflowOrchestrationService API routes ───────────────────────────
        location /api/Workflow {
            proxy_pass http://workfloworchestration;
        }
        location /api/WorkflowRule {
            proxy_pass http://workfloworchestration;
        }

        # ── DynamicFieldsSchemaService API routes ─────────────────────────────
        location /api/DynamicForm {
            proxy_pass http://dynamicfields;
        }

        # ── CustomerService API routes ────────────────────────────────────────
        location /api/customer {
            proxy_pass http://customerservice;
        }

        # ── TransactionService API routes ─────────────────────────────────────
        location /api/journal {
            proxy_pass http://transactionservice;
        }
        location /api/ledger {
            proxy_pass http://transactionservice;
        }

        # ── React Frontend (catch-all — must be last) ─────────────────────────
        location / {
            proxy_pass http://frontend;
        }
    }
}
